name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-mcp.lock
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python tools/check_public_examples.py
      - run: python -m unittest discover -s tests -v
      - name: Install browser test dependencies
        run: python -m pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - name: Real browser OAuth consent and callback
        run: python tools/browser_oauth_smoke.py
      - run: python -m compileall -q proxy_monitoring tests tools
      - run: python -m proxy_monitoring --config config.example.json validate
      - if: runner.os == 'Linux'
        run: python tools/smoke_linux.py
      - if: runner.os == 'Linux'
        run: systemd-analyze verify systemd/*.service
      - if: runner.os == 'Linux'
        name: Verify real 3proxy accounting and logdump
        shell: bash
        run: |
          curl -fL --retry 3 https://codeload.github.com/3proxy/3proxy/zip/refs/tags/0.9.5 -o "$RUNNER_TEMP/3proxy-0.9.5.zip"
          printf '%s  %s\n' bd575745f8eab180aab3277f1f44347ae121519d746bf3c81b8a2b9e2665d0af "$RUNNER_TEMP/3proxy-0.9.5.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/3proxy-0.9.5.zip" -d "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/3proxy-0.9.5" -f Makefile.Linux -j2
          python tools/probe_3proxy_accounting.py --binary "$RUNNER_TEMP/3proxy-0.9.5/bin/3proxy"
