[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-monitoring"
version = "0.3.0"
description = "Local proxy telemetry collector and SQLite storage"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
proxy-monitoring = "proxy_monitoring.cli:main"

[tool.setuptools.packages.find]
include = ["proxy_monitoring*"]
